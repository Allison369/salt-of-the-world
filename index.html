<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Bread — Bible Study</title>
    <meta name="description" content="Short, interactive Bible lessons arranged into paths — five minutes a day, with progress, streaks and Scripture memory." />
    <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Daily Bread — Bible Study" />
    <meta property="og:description" content="Short, interactive Bible lessons arranged into paths — five minutes a day." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var saved = localStorage.getItem('db_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
